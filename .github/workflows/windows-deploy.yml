name: Deploy for Windows

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  version-check:
    uses: ./.github/workflows/version-checks.yml

  setup-secrets:
    uses: ./.github/workflows/setup-secrets.yml
    secrets: inherit

  build:
    runs-on: windows-latest
    needs: [version-check, setup-secrets]
    if: needs.version-check.outputs.should-deploy == 'true'

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET 10.0
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    
    - name: Install .NET MAUI Workload
      run: dotnet workload install maui --skip-sign-check
    
    - name: Restore dependencies
      run: dotnet restore Vizar/Vizar/Vizar.csproj
    
    - name: Publish Windows MAUI App
      run: dotnet publish Vizar/Vizar/Vizar.csproj -f net10.0-windows10.0.19041.0 -c Release -p:WindowsPackageType=None -o Vizar/Vizar/publish/windows
    
    - name: Create Zip Archive
      run: Compress-Archive -Path "Vizar/Vizar/publish/windows/*" -DestinationPath "Vizar.zip" -Force
    
    - name: Upload Windows Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: windows-release
        path: Vizar.zip

  deploy:
    runs-on: windows-latest
    needs: [version-check, build]
    if: needs.version-check.outputs.should-deploy == 'true'
    permissions:
      contents: write

    steps:
    - name: Download artifact from build job
      uses: actions/download-artifact@v4
      with:
        name: windows-release
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ needs.version-check.outputs.current-version }}
        name: ${{ github.event.head_commit.message }}
        files: Vizar.zip
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Deployment Summary
      run: |
        echo "🚀 Successfully deployed Vizar Windows version ${{ needs.version-check.outputs.current-version }} to GitHub Releases"
