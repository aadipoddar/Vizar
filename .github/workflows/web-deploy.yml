name: Deploy to Azure Web App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  version-check:
    uses: ./.github/workflows/version-checks.yml

  build:
    runs-on: ubuntu-latest
    needs: version-check
    if: needs.version-check.outputs.should-deploy == 'true'
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore VizarLibrary
        run: dotnet restore VizarLibrary/VizarLibrary.csproj

      - name: Restore Vizar.Shared
        run: dotnet restore Vizar/Vizar.Shared/Vizar.Shared.csproj

      - name: Restore Vizar.Web
        run: dotnet restore Vizar/Vizar.Web/Vizar.Web.csproj

      - name: Create Secrets.local_secrets.cs
        run: |
          $secretsContent = @"
          namespace VizarLibrary.DataAccess;

          public static partial class Secrets
          {
              static Secrets()
              {
                  AzureConnectionString = "${{ secrets.AzureConnectionString }}";

                  AzureBlobStorageConnectionString = "${{ secrets.AzureBlobStorageConnectionString }}";
                  AzureBlobStorageAccountKey = "${{ secrets.AzureBlobStorageAccountKey }}";

                  SyncfusionLicense = "${{ secrets.SyncfusionLicense }}";

                  EmailPassword = "${{ secrets.EmailPassword }}";
                  ToEmail = "${{ secrets.ToEmail }}";
              }
          }
          "@
          Set-Content -Path "VizarLibrary/DataAccess/Secrets.local_secrets.cs" -Value $secretsContent
        shell: pwsh

      - name: Build VizarLibrary
        run: dotnet build VizarLibrary/VizarLibrary.csproj --configuration Release --no-restore

      - name: Build Vizar.Shared
        run: dotnet build Vizar/Vizar.Shared/Vizar.Shared.csproj --configuration Release --no-restore

      - name: Build Vizar.Web
        run: dotnet build Vizar/Vizar.Web/Vizar.Web.csproj --configuration Release --no-restore

      - name: Publish Vizar.Web
        run: dotnet publish Vizar/Vizar.Web/Vizar.Web.csproj -c Release -o ${{env.DOTNET_ROOT}}/myapp --no-build

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: ubuntu-latest
    needs: [version-check, build]
    if: needs.version-check.outputs.should-deploy == 'true'
    
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
      
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'vizar'
          slot-name: 'Production'
          package: .
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_610D1F10ABE245F095EE0B468DB3D371 }}
      
      - name: Deployment Summary
        run: |
          echo "🚀 Successfully deployed Vizar version ${{ needs.version-check.outputs.current-version }} to Azure"