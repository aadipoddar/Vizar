name: Deploy for Windows

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  version-check:
    uses: ./.github/workflows/version-checks.yml

  build-windows:
    runs-on: windows-latest
    needs: version-check
    if: needs.version-check.outputs.should-deploy == 'true'
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET 10.0
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    
    - name: Install .NET MAUI Workload
      run: dotnet workload install maui --skip-sign-check
    
    - name: Create Secrets.local_secrets.cs
      run: |
        $secretsContent = @"
        namespace VizarLibrary.DataAccess;

        public static partial class Secrets
        {
            static Secrets()
            {
                AzureConnectionString = "${{ secrets.AzureConnectionString }}";

                AzureBlobStorageConnectionString = "${{ secrets.AzureBlobStorageConnectionString }}";
                AzureBlobStorageAccountKey = "${{ secrets.AzureBlobStorageAccountKey }}";

                SyncfusionLicense = "${{ secrets.SyncfusionLicense }}";

                EmailPassword = "${{ secrets.EmailPassword }}";

                ToEmail = "${{ secrets.ToEmail }}";
            }
        }
        "@
        Set-Content -Path "VizarLibrary/DataAccess/Secrets.local_secrets.cs" -Value $secretsContent
    
    - name: Restore dependencies
      run: dotnet restore Vizar/Vizar/Vizar.csproj
    
    - name: Publish Windows MAUI App
      run: dotnet publish Vizar/Vizar/Vizar.csproj -f net10.0-windows10.0.19041.0 -c Release -p:WindowsPackageType=None -o Vizar/Vizar/publish/windows
    
    - name: Create Zip Archive
      run: Compress-Archive -Path "Vizar/Vizar/publish/windows/*" -DestinationPath "Vizar.zip" -Force
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ needs.version-check.outputs.current-version }}
        name: ${{ github.event.head_commit.message }}
        body: |
          ## Vizar ${{ needs.version-check.outputs.current-version }}
          
          **Release Date:** ${{ github.event.head_commit.timestamp }}
          
          ### What's New
          - Version ${{ needs.version-check.outputs.current-version }} release
          
          ### Download
          - Windows: Download `Vizar.zip` below
          
          ### Installation
          1. Download `Vizar.zip`
          2. Extract the archive
          3. Run `Vizar.exe`
          
          ---
          *Auto-generated release from GitHub Actions*
        files: Vizar.zip
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
