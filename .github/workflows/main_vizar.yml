# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - vizar

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore dependencies
        run: dotnet restore Vizar.slnx

      - name: Build VizarLibrary
        run: dotnet build VizarLibrary/VizarLibrary.csproj --configuration Release --no-restore

      - name: Build Vizar.Shared
        run: dotnet build Vizar/Vizar.Shared/Vizar.Shared.csproj --configuration Release --no-restore

      - name: Build Vizar.Web
        run: dotnet build Vizar/Vizar.Web/Vizar.Web.csproj --configuration Release --no-restore

      - name: Publish Vizar.Web
        run: dotnet publish Vizar/Vizar.Web/Vizar.Web.csproj -c Release -o ${{env.DOTNET_ROOT}}/myapp --no-build

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
      
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'vizar'
          slot-name: 'Production'
          package: .
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_610D1F10ABE245F095EE0B468DB3D371 }}