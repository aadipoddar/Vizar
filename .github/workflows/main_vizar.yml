# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy to Azure Web App - Vizar

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  version-check:
    runs-on: ubuntu-latest
    outputs:
      should-deploy: ${{ steps.final-decision.outputs.should-deploy }}
      current-version: ${{ steps.extract-version.outputs.version }}
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      
      - name: Extract current version from README
        id: extract-version
        run: |
          VERSION=$(grep -oP 'Latest Version = \K[0-9.]+' README.md)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $VERSION"
      
      - name: Get previous version
        id: get-previous
        run: |
          # Get the version from the previous commit
          git checkout HEAD~1 2>/dev/null || echo "No previous commit"
          PREV_VERSION=$(grep -oP 'Latest Version = \K[0-9.]+' README.md 2>/dev/null || echo "none")
          echo "previous=$PREV_VERSION" >> $GITHUB_OUTPUT
          echo "Previous version: $PREV_VERSION"
          git checkout -
      
      - name: Compare versions
        id: version-compare
        run: |
          CURRENT="${{ steps.extract-version.outputs.version }}"
          PREVIOUS="${{ steps.get-previous.outputs.previous }}"
          
          if [ "$CURRENT" != "$PREVIOUS" ]; then
            echo "version-changed=true" >> $GITHUB_OUTPUT
            echo "✅ Version changed: $PREVIOUS → $CURRENT"
          else
            echo "version-changed=false" >> $GITHUB_OUTPUT
            echo "⏭️ Version unchanged ($CURRENT)"
          fi
      
      - name: Verify Azure Connection String
        id: connection-check
        run: |
          CONNECTION_LINE=$(grep "_databaseConnection = Secrets" VizarLibrary/DataAccess/SqlDataAccess.cs)
          
          if echo "$CONNECTION_LINE" | grep -q "Secrets.AzureConnectionString"; then
            echo "connection-valid=true" >> $GITHUB_OUTPUT
            echo "✅ Using Azure connection string - Safe for deployment"
          elif echo "$CONNECTION_LINE" | grep -q "Secrets.LocalConnectionString"; then
            echo "connection-valid=false" >> $GITHUB_OUTPUT
            echo "❌ ERROR: Local connection string detected - Blocking deployment"
            exit 1
          else
            echo "connection-valid=false" >> $GITHUB_OUTPUT
            echo "❌ ERROR: Unknown connection string configuration - Blocking deployment"
            exit 1
          fi
      
      - name: Final deployment decision
        id: final-decision
        run: |
          VERSION_CHANGED="${{ steps.version-compare.outputs.version-changed }}"
          CONNECTION_VALID="${{ steps.connection-check.outputs.connection-valid }}"
          
          if [ "$VERSION_CHANGED" = "true" ] && [ "$CONNECTION_VALID" = "true" ]; then
            echo "should-deploy=true" >> $GITHUB_OUTPUT
            echo "🚀 All checks passed - Deployment will proceed"
          else
            echo "should-deploy=false" >> $GITHUB_OUTPUT
            echo "⛔ Deployment blocked - Requirements not met"
          fi

  build:
    runs-on: ubuntu-latest
    needs: version-check
    if: needs.version-check.outputs.should-deploy == 'true'
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore VizarLibrary
        run: dotnet restore VizarLibrary/VizarLibrary.csproj

      - name: Restore Vizar.Shared
        run: dotnet restore Vizar/Vizar.Shared/Vizar.Shared.csproj

      - name: Restore Vizar.Web
        run: dotnet restore Vizar/Vizar.Web/Vizar.Web.csproj

      - name: Build VizarLibrary
        run: dotnet build VizarLibrary/VizarLibrary.csproj --configuration Release --no-restore

      - name: Build Vizar.Shared
        run: dotnet build Vizar/Vizar.Shared/Vizar.Shared.csproj --configuration Release --no-restore

      - name: Build Vizar.Web
        run: dotnet build Vizar/Vizar.Web/Vizar.Web.csproj --configuration Release --no-restore

      - name: Publish Vizar.Web
        run: dotnet publish Vizar/Vizar.Web/Vizar.Web.csproj -c Release -o ${{env.DOTNET_ROOT}}/myapp --no-build

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: ubuntu-latest
    needs: [version-check, build]
    if: needs.version-check.outputs.should-deploy == 'true'
    
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
      
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'vizar'
          slot-name: 'Production'
          package: .
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_610D1F10ABE245F095EE0B468DB3D371 }}
      
      - name: Deployment Summary
        run: |
          echo "🚀 Successfully deployed Vizar version ${{ needs.version-check.outputs.current-version }} to Azure"