name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET 10.0
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    
    - name: Install .NET MAUI Workload
      run: dotnet workload install maui --skip-sign-check
    
    - name: Create Secrets.local_secrets.cs
      run: |
        $secretsContent = @"
        namespace VizarLibrary.DataAccess;

        public static partial class Secrets
        {
            static Secrets()
            {
                AzureConnectionString = "${{ secrets.AzureConnectionString }}";

                AzureBlobStorageConnectionString = "${{ secrets.AzureBlobStorageConnectionString }}";
                AzureBlobStorageAccountKey = "${{ secrets.AzureBlobStorageAccountKey }}";

                SyncfusionLicense = "${{ secrets.SyncfusionLicense }}";

                EmailPassword = "${{ secrets.EmailPassword }}";

                ToEmail = "${{ secrets.ToEmail }}";
            }
        }
        "@
        Set-Content -Path "VizarLibrary/DataAccess/Secrets.local_secrets.cs" -Value $secretsContent
    
    - name: Decode Keystore
      run: |
        New-Item -ItemType Directory -Path "Vizar/Vizar/key" -Force
        $keystoreBase64 = "${{ secrets.ANDROID_KEYSTORE_BASE64 }}"
        $keystoreBytes = [System.Convert]::FromBase64String($keystoreBase64)
        [System.IO.File]::WriteAllBytes("Vizar/Vizar/key/vizar.keystore", $keystoreBytes)
    
    - name: Restore dependencies
      run: dotnet restore Vizar/Vizar/Vizar.csproj
    
    - name: Build Android APK (Signed)
      run: |
        dotnet publish Vizar/Vizar/Vizar.csproj -f net10.0-android -c Release `
          /p:AndroidKeyStore=true `
          /p:AndroidSigningKeyStore="key/vizar.keystore" `
          /p:AndroidSigningKeyAlias="vizar" `
          /p:AndroidSigningKeyPass="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" `
          /p:AndroidSigningStorePass="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
    
    - name: Find APK file
      run: |
        Get-ChildItem -Path "Vizar/Vizar" -Filter "*.apk" -Recurse | Select-Object FullName
    
    - name: Upload Android APK Artifact
      run: |
        $apkPath = (Get-ChildItem -Path "Vizar/Vizar" -Filter "*.apk" -Recurse).FullName
        echo "Found APK: $apkPath"
        Copy-Item $apkPath -Destination "Vizar.apk"
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: Vizar.apk
