name: Build All Projects

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET 10.0
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    
    - name: Install .NET MAUI Workload
      run: dotnet workload install maui --skip-sign-check
    
    - name: Restore dependencies
      run: dotnet restore Vizar.slnx

    - name: Build ExcelImport
      run: dotnet build ExcelImport/ExcelImport.csproj --no-restore --configuration Release    

    - name: Build VizarLibrary
      run: dotnet build VizarLibrary/VizarLibrary.csproj --no-restore --configuration Release
    
    - name: Build Vizar.Shared
      run: dotnet build Vizar/Vizar.Shared/Vizar.Shared.csproj --no-restore --configuration Release
    
    - name: Build Vizar.Web
      run: dotnet build Vizar/Vizar.Web/Vizar.Web.csproj --no-restore --configuration Release
    
    - name: Build Vizar MAUI (Android)
      run: dotnet build Vizar/Vizar/Vizar.csproj --configuration Release --framework net10.0-android
    
    - name: Build Vizar MAUI (Windows)
      run: dotnet build Vizar/Vizar/Vizar.csproj --configuration Release --framework net10.0-windows10.0.19041.0
    
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2
    
    - name: Build SQL Server Database Project
      run: msbuild DBVizar/DBVizar.sqlproj /p:Configuration=Release /p:Platform="Any CPU"
